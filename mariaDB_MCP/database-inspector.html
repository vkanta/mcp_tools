<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CES Database Inspector</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .query-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .results { background: white; padding: 20px; border-radius: 8px; min-height: 200px; }
        textarea { width: 100%; height: 100px; font-family: monospace; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #005999; }
        .quick-buttons { margin: 10px 0; }
        pre { background: #f8f8f8; padding: 15px; border-radius: 4px; overflow-x: auto; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 4px; }
        .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 4px; }
        h1 { color: #333; }
        h2 { color: #666; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ CES Database Inspector</h1>
        <p>Connected to MariaDB via MCP Server on port 3004</p>
        
        <div class="query-box">
            <h2>📝 Execute SQL Query</h2>
            <textarea id="sqlQuery" placeholder="Enter SQL query here...">SELECT * FROM campaigns LIMIT 5;</textarea>
            <br>
            <button onclick="executeQuery()">Execute Query</button>
            
            <div class="quick-buttons">
                <strong>Quick Queries:</strong><br>
                <button onclick="setQuery('SELECT * FROM campaigns')">Show Campaigns</button>
                <button onclick="setQuery('SELECT * FROM components')">Show Components</button>
                <button onclick="setQuery('SHOW TABLES')">Show Tables</button>
                <button onclick="setQuery('SELECT c.name as campaign, comp.name as component, comp.version FROM campaigns c JOIN campaign_components cc ON c.id = cc.campaign_id JOIN components comp ON cc.component_id = comp.id')">Show Relationships</button>
                <button onclick="setQuery('DESCRIBE campaigns')">Describe Campaigns</button>
            </div>
        </div>
        
        <div class="results">
            <h2>📊 Query Results</h2>
            <div id="results">Click "Execute Query" or use quick buttons to see results...</div>
        </div>
    </div>

    <script>
        function setQuery(sql) {
            document.getElementById('sqlQuery').value = sql;
        }
        
        async function executeQuery() {
            const query = document.getElementById('sqlQuery').value;
            const resultsDiv = document.getElementById('results');
            
            if (!query.trim()) {
                resultsDiv.innerHTML = '<div class="error">Please enter a SQL query</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div>Executing query...</div>';
            
            try {
                // First, establish SSE connection (simplified for demo)
                const response = await fetch('http://localhost:3004/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        jsonrpc: "2.0",
                        method: "tools/call",
                        params: {
                            sessionId: "web-inspector-" + Date.now(),
                            name: "execute_query",
                            arguments: {
                                query: query
                            }
                        },
                        id: Date.now()
                    })
                });
                
                if (response.ok) {
                    resultsDiv.innerHTML = '<div class="success">Query executed successfully! (Note: This is a demo interface - results would appear via SSE in a full implementation)</div>';
                } else {
                    throw new Error('HTTP ' + response.status);
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}<br><br>
                Note: This is a demo interface. For actual database queries, use:<br>
                • The db-helper.sh script<br>
                • Direct podman exec commands<br>
                • The MariaDB MCP server endpoints</div>`;
            }
        }
        
        // Show database status on load
        window.onload = function() {
            fetch('http://localhost:3004/health')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        document.querySelector('p').innerHTML = '✅ Connected to MariaDB via MCP Server on port 3004';
                    }
                })
                .catch(() => {
                    document.querySelector('p').innerHTML = '❌ MCP Server not available on port 3004';
                });
        };
    </script>
</body>
</html>
